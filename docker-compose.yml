services:
  spl-visualizer:
    build:
      context: .
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
    image: spl-visualizer:latest
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8787
      GENERATED_DATA_DIR: /app/data
      GENERATED_WORKSPACES_DIR: /app/generated-workspaces
      GENERATED_DIST_DIR: /app/generated-dist
      OPENCODE_TIMEOUT_MS: ${OPENCODE_TIMEOUT_MS:-600000}
      GENERATED_VIEW_TTL_HOURS: ${GENERATED_VIEW_TTL_HOURS:-168}
    volumes:
      - spl_visualizer_data:/app/data
      - spl_visualizer_workspaces:/app/generated-workspaces
      - spl_visualizer_generated_dist:/app/generated-dist
      # Optional: instead of VLLM_* vars in .env, mount your Pi model config:
      # - ${HOME}/.pi/agent/models.json:/home/node/.pi/agent/models.json:ro
    restart: unless-stopped

volumes:
  spl_visualizer_data:
  spl_visualizer_workspaces:
  spl_visualizer_generated_dist:
