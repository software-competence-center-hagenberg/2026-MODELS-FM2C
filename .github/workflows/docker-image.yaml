name: Build and publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: containers.github.scch.at
  IMAGE_NAMESPACE: fm2conf

jobs:
  docker:
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name and tags
        id: vars
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY##*/}"
          image_name="$(printf '%s' "$repo_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          image="${REGISTRY}/${IMAGE_NAMESPACE}/${image_name}"

          tags=()
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=("${image}:main")
            tags+=("${image}:sha-${GITHUB_SHA::12}")
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags+=("${image}:${GITHUB_REF_NAME}")
          fi

          if [[ ${#tags[@]} -eq 0 ]]; then
            tags+=("${image}:ci-${GITHUB_SHA::12}")
          fi

          {
            echo "image_name=${image_name}"
            echo "image=${image}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ steps.vars.outputs.image_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
