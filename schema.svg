<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <defs>
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .root { fill: #1a1a2e; }
      .sf { fill: #e65100; }
      .ab { fill: #1565c0; }
      .db { fill: #2e7d32; }
      .mod-web { fill: #fff3e0; stroke: #e65100; stroke-width: 1; }
      .mod-api { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1; }
      .mod-db { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1; }
      .opt { fill: #f0e68c; stroke: #888; stroke-width: 1; }
      .edge { stroke: #999; stroke-width: 1.2; }
      .edge-m { stroke: #2e7d32; stroke-width: 1.5; }
      .edge-opt { stroke: #888; stroke-width: 1; stroke-dasharray: 4,3; }
      .edge-w { stroke: #e65100; stroke-width: 1; }
      .edge-b { stroke: #1565c0; stroke-width: 1; }
      .edge-g { stroke: #2e7d32; stroke-width: 1; }
      .label { font-size: 9px; fill: #666; }
    </style>
    <marker id="arrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="#999"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Docker Compose SPL — Feature Diagram</text>
  <text x="600" y="50" text-anchor="middle" font-size="12" fill="#888">Generated from docker.uvl</text>

  <!-- Root node -->
  <rect x="460" y="70" width="280" height="44" rx="22" class="root"/>
  <text x="600" y="98" text-anchor="middle" fill="white" font-size="15" font-weight="600">Docker Compose</text>

  <!-- Optional top-level -->
  <line x1="520" y1="114" x2="380" y2="155" class="edge edge-opt" marker-end="url(#arrow)"/>
  <text x="420" y="130" class="label">optional</text>
  <rect x="290" y="155" width="110" height="28" rx="14" class="opt"/>
  <text x="345" y="174" text-anchor="middle" font-size="11">Spec Version</text>

  <line x1="680" y1="114" x2="820" y2="155" class="edge edge-opt" marker-end="url(#arrow)"/>
  <text x="780" y="130" class="label">optional</text>
  <rect x="730" y="155" width="110" height="28" rx="14" class="opt"/>
  <text x="785" y="174" text-anchor="middle" font-size="11">Project Name</text>

  <!-- Services diamond -->
  <line x1="600" y1="114" x2="600" y2="155" class="edge edge-m" marker-end="url(#arrow)"/>
  <text x="610" y="135" class="label" font-weight="bold">mandatory [1..3]</text>

  <!-- Three services -->
  <line x1="560" y1="175" x2="250" y2="240" class="edge edge-w"/>
  <line x1="600" y1="175" x2="600" y2="240" class="edge edge-b"/>
  <line x1="640" y1="175" x2="950" y2="240" class="edge edge-g"/>

  <!-- Web Frontend -->
  <rect x="140" y="240" width="220" height="40" rx="20" class="sf"/>
  <text x="250" y="265" text-anchor="middle" fill="white" font-size="14" font-weight="600">🌐 Web Frontend</text>
  <text x="250" y="278" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">nginx:1.27-alpine</text>

  <!-- API Backend -->
  <rect x="490" y="240" width="220" height="40" rx="20" class="ab"/>
  <text x="600" y="265" text-anchor="middle" fill="white" font-size="14" font-weight="600">⚡ API Backend</text>
  <text x="600" y="278" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">node:22-alpine</text>

  <!-- Database -->
  <rect x="840" y="240" width="220" height="40" rx="20" class="db"/>
  <text x="950" y="265" text-anchor="middle" fill="white" font-size="14" font-weight="600">🗄️ Database</text>
  <text x="950" y="278" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">postgres:17-alpine</text>

