  <line x1="200" y1="280" x2="100" y2="330" class="edge"/>
  <line x1="240" y1="280" x2="190" y2="330" class="edge"/>
  <line x1="270" y1="280" x2="290" y2="330" class="edge"/>
  <line x1="300" y1="280" x2="390" y2="330" class="edge"/>
  <rect x="55" y="330" width="90" height="26" rx="13" class="mod-web"/>
  <text x="100" y="347" text-anchor="middle" font-size="10">Port Mapping</text>
  <rect x="145" y="330" width="90" height="26" rx="13" class="mod-web"/>
  <text x="190" y="347" text-anchor="middle" font-size="10">Health Check</text>
  <rect x="245" y="330" width="90" height="26" rx="13" class="mod-web"/>
  <text x="290" y="347" text-anchor="middle" font-size="10">Asset Mount</text>
  <rect x="345" y="330" width="90" height="26" rx="13" class="mod-web"/>
  <text x="390" y="347" text-anchor="middle" font-size="10">HTTPS Term.</text>

  <!-- Web modules row 2 -->
  <line x1="200" y1="356" x2="130" y2="400" class="edge"/>
  <line x1="250" y1="356" x2="250" y2="400" class="edge"/>
  <line x1="300" y1="356" x2="370" y2="400" class="edge"/>
  <rect x="85" y="400" width="90" height="26" rx="13" class="mod-web"/>
  <text x="130" y="417" text-anchor="middle" font-size="10">CDN Caching</text>
  <rect x="205" y="400" width="90" height="26" rx="13" class="mod-web"/>
  <text x="250" y="417" text-anchor="middle" font-size="10">Rate Limit</text>
  <rect x="325" y="400" width="90" height="26" rx="13" class="mod-web"/>
  <text x="370" y="417" text-anchor="middle" font-size="10">Deploy Res.</text>

  <!-- API modules row 1 -->
  <line x1="540" y1="280" x2="430" y2="330" class="edge"/>
  <line x1="580" y1="280" x2="530" y2="330" class="edge"/>
  <line x1="620" y1="280" x2="630" y2="330" class="edge"/>
  <line x1="660" y1="280" x2="730" y2="330" class="edge"/>
  <rect x="385" y="330" width="90" height="26" rx="13" class="mod-api"/>
  <text x="430" y="347" text-anchor="middle" font-size="10">API Port</text>
  <rect x="485" y="330" width="90" height="26" rx="13" class="mod-api"/>
  <text x="530" y="347" text-anchor="middle" font-size="10">Env Config</text>
  <rect x="585" y="330" width="90" height="26" rx="13" class="mod-api"/>
  <text x="630" y="347" text-anchor="middle" font-size="10">Health Check</text>
  <rect x="685" y="330" width="90" height="26" rx="13" class="mod-api"/>
  <text x="730" y="347" text-anchor="middle" font-size="10">Hot Reload</text>

  <!-- API modules row 2 -->
  <line x1="550" y1="356" x2="490" y2="400" class="edge"/>
  <line x1="600" y1="356" x2="600" y2="400" class="edge"/>
  <line x1="650" y1="356" x2="710" y2="400" class="edge"/>
  <rect x="445" y="400" width="90" height="26" rx="13" class="mod-api"/>
  <text x="490" y="417" text-anchor="middle" font-size="10">Logging</text>
  <rect x="555" y="400" width="90" height="26" rx="13" class="mod-api"/>
  <text x="600" y="417" text-anchor="middle" font-size="10">Deploy Res.</text>
  <rect x="665" y="400" width="90" height="26" rx="13" class="mod-api"/>
  <text x="710" y="417" text-anchor="middle" font-size="10">Metrics</text>

  <!-- DB modules row 1 -->
  <line x1="890" y1="280" x2="820" y2="330" class="edge"/>
  <line x1="930" y1="280" x2="920" y2="330" class="edge"/>
  <line x1="970" y1="280" x2="1020" y2="330" class="edge"/>
  <line x1="1010" y1="280" x2="1120" y2="330" class="edge"/>
  <rect x="775" y="330" width="90" height="26" rx="13" class="mod-db"/>
  <text x="820" y="347" text-anchor="middle" font-size="10">DB Port</text>
  <rect x="875" y="330" width="90" height="26" rx="13" class="mod-db"/>
  <text x="920" y="347" text-anchor="middle" font-size="10">Persist. Vol.</text>
  <rect x="975" y="330" width="90" height="26" rx="13" class="mod-db"/>
  <text x="1020" y="347" text-anchor="middle" font-size="10">Credentials</text>
  <rect x="1075" y="330" width="90" height="26" rx="13" class="mod-db"/>
  <text x="1120" y="347" text-anchor="middle" font-size="10">Health Check</text>

  <!-- DB modules row 2 -->
  <line x1="900" y1="356" x2="860" y2="400" class="edge"/>
  <line x1="940" y1="356" x2="960" y2="400" class="edge"/>
  <line x1="970" y1="356" x2="1060" y2="400" class="edge"/>
  <line x1="1010" y1="356" x2="1160" y2="400" class="edge"/>
  <rect x="815" y="400" width="90" height="26" rx="13" class="mod-db"/>
  <text x="860" y="417" text-anchor="middle" font-size="10">Auto Backup</text>
  <rect x="915" y="400" width="90" height="26" rx="13" class="mod-db"/>
  <text x="960" y="417" text-anchor="middle" font-size="10">Conn. Pooler</text>
  <rect x="1015" y="400" width="90" height="26" rx="13" class="mod-db"/>
  <text x="1060" y="417" text-anchor="middle" font-size="10">Deploy Res.</text>
  <rect x="1115" y="400" width="90" height="26" rx="13" class="mod-db"/>
  <text x="1160" y="417" text-anchor="middle" font-size="10">Metrics</text>

  <!-- Legend -->
  <rect x="30" y="460" width="240" height="140" rx="8" fill="white" stroke="#ddd"/>
  <text x="45" y="480" font-size="11" font-weight="bold" fill="#333">Legend</text>
  <rect x="45" y="490" width="14" height="14" rx="4" fill="#e65100"/><text x="65" y="502" font-size="10" fill="#555">Web Frontend modules</text>
  <rect x="45" y="510" width="14" height="14" rx="4" fill="#1565c0"/><text x="65" y="522" font-size="10" fill="#555">API Backend modules</text>
  <rect x="45" y="530" width="14" height="14" rx="4" fill="#2e7d32"/><text x="65" y="542" font-size="10" fill="#555">Database modules</text>
  <line x1="45" y1="560" x2="59" y2="560" stroke="#888" stroke-dasharray="4,3"/><text x="65" y="564" font-size="10" fill="#555">Optional feature</text>
  <line x1="45" y1="575" x2="59" y2="575" stroke="#2e7d32" stroke-width="2"/><text x="65" y="579" font-size="10" fill="#555">Mandatory feature</text>

  <!-- Constraints -->
  <rect x="300" y="460" width="300" height="100" rx="8" fill="#ffebee" stroke="#c62828" stroke-dasharray="4,3"/>
  <text x="450" y="482" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">⚠ Constraints</text>
  <text x="315" y="500" font-size="10" fill="#b71c1c">BuildContext → !AlternateDockerFile</text>
  <text x="315" y="515" font-size="10" fill="#b71c1c">HotReload + Deploy → warning</text>
  <text x="315" y="530" font-size="10" fill="#b71c1c">ConnPooler + HotReload → warning</text>

  <!-- Category legend -->
  <rect x="650" y="460" width="520" height="140" rx="8" fill="white" stroke="#ddd"/>
  <text x="665" y="480" font-size="11" font-weight="bold" fill="#333">Module Categories</text>
  <circle cx="672" cy="500" r="5" fill="#ff9800"/><text x="685" y="504" font-size="10" fill="#555">core — Essential service features</text>
  <circle cx="672" cy="520" r="5" fill="#2196f3"/><text x="685" y="524" font-size="10" fill="#555">network — Port and connectivity config</text>
  <circle cx="672" cy="540" r="5" fill="#4caf50"/><text x="685" y="544" font-size="10" fill="#555">storage — Persistent data and volumes</text>
  <circle cx="870" cy="500" r="5" fill="#9c27b0"/><text x="883" y="504" font-size="10" fill="#555">build — Compile and build options</text>
  <circle cx="870" cy="520" r="5" fill="#f44336"/><text x="883" y="524" font-size="10" fill="#555">deploy — Production resource settings</text>
  <circle cx="870" cy="540" r="5" fill="#607d8b"/><text x="883" y="544" font-size="10" fill="#555">optional — Nice-to-have extras</text>

  <!-- Footer -->
  <text x="600" y="630" text-anchor="middle" font-size="10" fill="#999">Docker Compose SPL Feature Diagram — 3 service images, 22 configurable modules, 4 strategic constraints</text>
</svg>
