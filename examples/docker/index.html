<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/docker/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docker SPL Configurator</title>
    <script type="module" crossorigin src="/docker/assets/index-CQ7gnSyr.js"></script>
    <link rel="stylesheet" crossorigin href="/docker/assets/index-CWozCZ8o.css">
  </head>
  <body>
    <div id="nav-root"></div>
    <div id="root"></div>
    <script>
      (function() {
        var nav = document.createElement('nav');
        nav.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;align-items:center;gap:0;background:linear-gradient(135deg,#0f172a,#1e293b);border-bottom:1px solid #334155;padding:0 16px;height:48px;font-family:system-ui,-apple-system,sans-serif;';
        var logo = document.createElement('span');
        logo.style.cssText = 'color:#f8fafc;font-weight:800;font-size:14px;margin-right:24px;letter-spacing:-0.02em;';
        logo.textContent = 'fm2c';
        nav.appendChild(logo);
        var links = [
          { href: '/', label: 'Configurator Chat', active: false },
          { href: '/docker', label: 'Docker Config', active: true },
          { href: '/firefox', label: 'Firefox Config', active: false },
        ];
        links.forEach(function(link) {
          var a = document.createElement('a');
          a.href = link.href;
          a.textContent = link.label;
          a.style.cssText = 'color:' + (link.active ? '#93c5fd' : '#94a3b8') + ';text-decoration:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:' + (link.active ? '700' : '500') + ';background:' + (link.active ? '#1e40af20' : 'transparent') + ';transition:all 0.15s;cursor:pointer;';
          a.onmouseover = function() { if (!link.active) { a.style.color = '#e2e8f0'; a.style.background = '#33415540'; } };
          a.onmouseout = function() { if (!link.active) { a.style.color = '#94a3b8'; a.style.background = 'transparent'; } };
          nav.appendChild(a);
        });
        document.getElementById('nav-root').appendChild(nav);
        document.getElementById('root').style.marginTop = '48px';
      })();
    </script>
  </body>
</html>
